# =============================================================================
# Pipeline de CD — Terraform (IaC)
# =============================================================================
name: CD — Terraform

on:
  workflow_run:
    workflows:
      - "Backend CI"
      - "Frontend CI"
      - "Deploy Landing Page"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Init · Plan · Apply
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    defaults:
      run:
        working-directory: ./terraform

    env:
      TF_VAR_supabase_access_token:  ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_VAR_supabase_org_id:        ${{ secrets.SUPABASE_ORG_ID }}
      TF_VAR_supabase_db_password:   ${{ secrets.SUPABASE_DB_PASSWORD }}
      TF_VAR_render_api_key:         ${{ secrets.RENDER_API_KEY }}
      TF_VAR_render_owner_id:        ${{ secrets.RENDER_OWNER_ID }}
      TF_VAR_netlify_auth_token:     ${{ secrets.NETLIFY_AUTH_TOKEN }}
      TF_VAR_netlify_site_name:      ${{ secrets.NETLIFY_SITE_NAME }}
      TF_VAR_dockerhub_username:     ${{ secrets.DOCKERHUB_USERNAME }}
      TF_VAR_backend_secret_key:     ${{ secrets.BACKEND_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download landing build artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: deploy-landing.yml
          name: landing-dist
          path: landing/dist/
          if_no_artifact_found: warn

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Restore Terraform state
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-${{ github.ref_name }}
          restore-keys: terraform-state-

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Save Terraform state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: terraform/terraform.tfstate
          retention-days: 30

      - name: Show Outputs
        run: terraform output
